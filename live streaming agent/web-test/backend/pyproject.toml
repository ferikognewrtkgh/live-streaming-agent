[project]
name = "live_streaming_agent-live-backend"
version = "0.1.0"
description = "Independent FastAPI and Elasticsearch backend for the LiveStreamingAgent live console."
requires-python = ">=3.11"
dependencies = [
  "elasticsearch[async]>=8.17,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=1.26.4,<2",
  "pydantic-settings>=2.7,<3",
  "sentence-transformers==5.6.0",
  "torch==2.6.0",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=16,<17",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
